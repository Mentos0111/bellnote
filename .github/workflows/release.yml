name: release

# 打 tag 就自动构建，并把 APK 挂到对应 Release 上。
# 也可以在 Actions 页面手动 Run workflow，指定已有 tag（用于补发/重发）。
#
# 版本号的真相源就是 tag：CI 把 tag 去掉 v 之后用 -PbellnoteVersionName 传给 Gradle，
# 构建完再用 aapt2 读包里真实的 versionName / versionCode 复核一遍，两边不一致就红。
# 改了什么必须写进 CHANGELOG.md，Release 说明从那里抽。
#
# 结构（并行跑，省一轮时间）：
#   meta  ── 解析 tag/版本号
#   test  ── 单测（与 build 并行）
#   build ── 打包 + 版本复核 + 上传 artifact
#   publish ── 等 test/build 都过，再发 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在），例如 v3.12'
        required: true
      ref:
        description: '构建哪个 ref（默认 main）'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      versioncode: ${{ steps.meta.outputs.versioncode }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag, version and versionCode
        id: meta
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          tag = os.environ["TAG"].strip()
          m = re.fullmatch(r"v(\d+)\.(\d+)(?:\.(\d+))?(?:-([0-9A-Za-z.]+))?", tag)
          if not m:
              sys.exit(f"tag 格式不对：{tag}（要写成 v3.12 或 v3.12.1）")

          major, minor, patch, pre = m.group(1), m.group(2), m.group(3) or "0", m.group(4)
          version = tag[1:]
          code = int(major) * 10000 + int(minor) * 100 + int(patch)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"version={version}\n")
              out.write(f"versioncode={code}\n")
              out.write(f"prerelease={'true' if pre else 'false'}\n")

          print(f"tag={tag} version={version} versionCode={code} prerelease={bool(pre)}")
          PY

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain

  build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        # 不再用 android-actions/setup-android：它内部跑 `sdkmanager tools`，
        # 而新版 cmdline-tools 已经没有 `tools` 这个包，会直接失败。
        # ubuntu 镜像本来就预装 SDK，这里只打印现状并接受 license。
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Verify release signing secrets
        # 公开分发只允许正式 keystore：4 个 secrets 缺任何一个都直接失败。
        # 这里只报「缺哪几项」，不打印任何密码或 keystore 内容。
        # 本仓库不再创建、也不使用 keystore/debug.keystore；没有任何「警告后继续发布」的分支。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::发布被拒绝：缺少签名配置 →$missing"
            echo "### ❌ 发布被拒绝：缺少签名配置 →$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "公开 Release 必须用正式 keystore 签名，不会退回 debug key。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "签名配置齐全（4 项），继续构建。"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/bellnote-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::KEYSTORE_BASE64 解出来的 keystore 是空的"
            exit 1
          fi
          {
            echo "BELLNOTE_KEYSTORE=$KEYSTORE_PATH"
            echo "BELLNOTE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BELLNOTE_KEY_ALIAS=$KEY_ALIAS"
            echo "BELLNOTE_KEY_PASSWORD=$KEY_PASSWORD"
            # 严格模式：Gradle 里再兜一道，缺正式签名就 throw，不会静默退回 debug key
            echo "BELLNOTE_STRICT_SIGNING=true"
          } >> "$GITHUB_ENV"
          echo "### ✅ 本次用正式 keystore 签名（严格模式）" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --build-cache \
            "-PbellnoteVersionName=$VERSION"

      - name: Verify APK version matches the tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          EXPECTED_CODE: ${{ needs.meta.outputs.versioncode }}
        run: |
          set -euo pipefail
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > badging.txt
          python3 - <<'PY'
          import os, re, sys

          badging = open("badging.txt", encoding="utf-8", errors="replace").read().lstrip("\ufeff")
          m = re.search(
              r"^package: name='[^']*' versionCode='(\d+)' versionName='([^']*)'",
              badging,
              re.M,
          )
          if not m:
              sys.exit("aapt2 输出里找不到 package 行，无法复核版本号")

          code, name = int(m.group(1)), m.group(2)
          want_name = os.environ["VERSION"]
          want_code = int(os.environ["EXPECTED_CODE"])
          print(f"tag={want_name} / APK versionName={name} versionCode={code} / 期望 {want_code}")
          if name != want_name or code != want_code:
              sys.exit("包里版本号和 tag 不一致（Gradle 注入没生效？）")
          print("版本号校验通过")
          PY

      - name: Name the APK after the tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/bellnote-${VERSION}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bellnote-apk
          path: dist/bellnote-*.apk
          if-no-files-found: error

  publish:
    needs: [meta, unit-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bellnote-apk
          path: dist

      - name: Check CHANGELOG and extract release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, re, sys

          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.M | re.S,
          )
          m = pattern.search(text)
          body = m.group(1).strip() if m else ""
          if not body:
              sys.exit(
                  f"CHANGELOG.md 里没有 '## [{version}]' 小节（或它是空的）。"
                  "发版前先把这版改了什么写进去。"
              )

          # 固定抬头（安装要求 / 校验 / 升级提示 / 反馈），每次发版自动带上。
          # 文件不存在时跳过，方便老 tag 重跑。
          preamble = ""
          if os.path.exists(".github/release-preamble.md"):
              with open(".github/release-preamble.md", encoding="utf-8") as f:
                  preamble = f.read().strip()

          # APK 的 SHA-256 自动写进说明，省得手动核。
          sha = ""
          apks = sorted(glob.glob("dist/bellnote-*.apk"))
          if apks:
              h = hashlib.sha256()
              with open(apks[0], "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              sha = h.hexdigest()

          if preamble:
              preamble = preamble.replace("{version}", version).replace("{sha256}", sha or "（见附件）")

          parts = []
          if preamble:
              parts.append(preamble)
          parts.append(body)
          notes = "\n\n---\n\n".join(parts) + "\n"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print(notes)
          PY

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Bellnote ${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: dist/bellnote-*.apk
          fail_on_unmatched_files: true

  # 发布之后自己再核对一遍：Release 不是草稿、附件在、大小正常、SHA-256 有、
  # 说明里带本版版本号。少了任何一项就红，不靠人去看。
  verify:
    needs: [meta, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases/tags/$TAG" -o release.json
          python3 - <<'PY'
          import json, os, sys

          d = json.load(open("release.json", encoding="utf-8"))
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          problems = []

          if d.get("draft"):
              problems.append("Release 还是草稿，没有真正发布")
          if d.get("tag_name") != tag:
              problems.append(f"tag 对不上：{d.get('tag_name')} != {tag}")

          want = f"bellnote-{version}.apk"
          assets = {a["name"]: a for a in d.get("assets", [])}
          if want not in assets:
              problems.append(f"缺附件 {want}（现有：{list(assets) or '无'}）")
          else:
              a = assets[want]
              size = a.get("size", 0)
              digest = a.get("digest") or ""
              print(f"附件 {want}: {size} 字节, digest={digest}")
              if size < 20 * 1024 * 1024:
                  problems.append(f"APK 只有 {size} 字节，像构建失败")
              if not digest.startswith("sha256:"):
                  problems.append("附件没有 SHA-256 摘要，别人没法核验")

          body = d.get("body") or ""
          if version not in body:
              problems.append("Release 说明里找不到本版版本号（CHANGELOG 抽取可能失败）")

          if problems:
              print("发布核验失败：")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("发布核验通过")
          PY

  # 国内下载渠道：把这一版的 APK 再挂一份到 Gitee 发行版。
  # 手机在国内直连 GitHub 下载很慢/打不开，Gitee 是国内的同类服务，链接长这样：
  #   https://gitee.com/<用户名>/<仓库>/releases/download/v3.21.4/bellnote-3.21.4.apk
  # 没配 GITEE_TOKEN / GITEE_OWNER / GITEE_REPO 三个 Secrets 就自动跳过（不红），
  # 配歪了也只算「镜像失败」，continue-on-error 保证 GitHub 这边的发布不受影响。
  gitee-mirror:
    needs: [meta, publish]
    if: ${{ needs.meta.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bellnote-apk
          path: dist

      - name: Skip when Gitee is not configured
        id: gate
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_OWNER:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "::notice::没配 Gitee 的 3 个 Secrets，跳过国内镜像"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the tag to Gitee
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" 2>/dev/null || \
            git remote set-url gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          # 令牌不能落到日志里：git 报错会带远端地址，统一过一遍脱敏
          # 除了本版 tag，再强制推一个 latest（Gitee 上「永远指向最新版」的发行版挂在这上面）
          { git push -f gitee "refs/tags/${TAG}:refs/tags/${TAG}" "refs/tags/${TAG}:refs/tags/latest" || \
            echo "::warning::tag 推送失败（多半是 Gitee 上还没有这个 tag，先本地 git push 一次）"; } 2>&1 \
            | sed "s|${GITEE_TOKEN}|***|g"

      - name: Build Gitee release notes
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, hashlib, glob

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          sha = ""
          apks = sorted(glob.glob("dist/bellnote-*.apk"))
          if apks:
              h = hashlib.sha256()
              with open(apks[0], "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              sha = h.hexdigest()
          head = (
              "> 这是 **Bellnote %s** 的国内镜像，和 GitHub 上那一份是同一个包（SHA-256 一致）。\n"
              ">\n"
              "> ⚠️ **手机下载后如果文件名变成 `bellnote-%s.apk.zip`（或提示是压缩包），把最后的 `.zip` 删掉、改成 `.apk`，再点它就能安装。**"
              "这是 Gitee 把安装包误标成压缩包导致的，文件本身完好。\n"
              ">\n"
              "> - 安装要求：Android 11 及以上\n"
              "> - SHA-256：`%s`\n"
              "> - GitHub 原版：https://github.com/%s/releases/tag/v%s\n\n---\n\n"
          ) % (version, version, sha or "（见附件）", os.environ.get("GITHUB_REPOSITORY", ""), version)
          open("gitee-notes.md", "w", encoding="utf-8").write(head + body + "\n")
          print("gitee-notes.md 写好")
          PY

      - name: Create release and upload APK
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ needs.meta.outputs.tag }}
          APK_PATH: dist/bellnote-${{ needs.meta.outputs.version }}.apk
          BODY_PATH: gitee-notes.md
        run: |
          set -euo pipefail
          python3 scripts/gitee_sync.py 2>&1 | sed "s|${GITEE_TOKEN}|***|g"

      - name: Update the "always latest" link
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          VERSION: ${{ needs.meta.outputs.version }}
          APK_PATH: dist/bellnote-${{ needs.meta.outputs.version }}.apk
        run: |
          set -euo pipefail
          python3 scripts/gitee_sync.py --latest 2>&1 | sed "s|${GITEE_TOKEN}|***|g"

