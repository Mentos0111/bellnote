name: release

# 打 tag 就自动构建，并把 APK 挂到对应 Release 上。
# 也可以在 Actions 页面手动 Run workflow，指定已有 tag（用于补发/重发）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在），例如 v2.2'
        required: true
      ref:
        description: '构建哪个 ref（默认 main）'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # push tag 时构建那个 tag；手动触发时构建 inputs.ref
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        # 不再用 android-actions/setup-android：它内部跑 `sdkmanager tools`，
        # 而新版 cmdline-tools 已经没有 `tools` 这个包，会直接失败。
        # GitHub 的 ubuntu 镜像本来就预装 SDK，这里只打印现状并接受 license。
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.tag }}"
          VERSION="${VERSION#v}"
          cp app/build/outputs/apk/release/app-release.apk "dist/bellnote-${VERSION}.apk"
          ls -l dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Bellnote ${{ steps.meta.outputs.tag }}
          files: dist/bellnote-*.apk
          fail_on_unmatched_files: true
